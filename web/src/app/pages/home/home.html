<div class="page wrap title">
  <pixel-dino sprite="trex" [scale]="9" label="Pixel art tyrannosaurus" />

  <h1>DINO CLUB</h1>
  <p class="dim tagline">THE VERY FIRST DINO MOVIE CLUB IN THE SOUTH</p>

  <div class="actions">
    <button class="btn btn--discord" type="button" (click)="soon('DISCORD')">JOIN DISCORD</button>
    <button class="btn" type="button" (click)="soon('UNC CLUB')">JOIN UNC CLUB</button>
  </div>
  @if (pending()) {
    <p class="soon" role="status">{{ pending() }} LINK COMING SOON</p>
  }

  <div class="actions">
    <a class="btn btn--alt" routerLink="/quiz">DINO PERSONALITY TEST</a>
    <a class="btn btn--alt" routerLink="/recommender">DINO MOVIE RECOMMENDATION</a>
  </div>

  <p class="welcome blink">&#9654; EVERYONE IS WELCOME!</p>
</div>
