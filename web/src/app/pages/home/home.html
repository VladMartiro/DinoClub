<div class="page wrap title">

    class="hero"
    src="dino-club-logo.png"
    alt="Dino Club logo: a dinosaur in a UNC sweater sitting on the Old Well"
    width="445"
    height="560"
  />

  <h1>DINO CLUB</h1>

  <div class="actions">
