<div class="page wrap">
  <figure class="logo">
    <img
      src="dino-club-logo.jpg"
      alt="Dino Club logo: a dinosaur in a UNC sweater sitting on top of the Old Well"
      width="720"
      height="720"
    />
  </figure>

  <h1>THE CREW</h1>
  <p class="dim intro">THE BIG DINOS</p>

  <div class="crew">
    @for (member of crew; track member.name; let i = $index) {
      <article class="box card">
        <div class="shot">
          @if (member.photo) {
            <img [src]="member.photo" [alt]="member.name" />
          } @else {
            <div class="slot">
              <pixel-dino [sprite]="member.sprite" [scale]="5" [flip]="i % 2 === 1" />
              <span class="slot__tag">PHOTO</span>
            </div>
          }
        </div>
        <h3>{{ member.name }}</h3>
        <p class="dim role">{{ member.role }}</p>
      </article>
    }
  </div>
</div>
