<div class="page wrap mid">
  <pixel-dino sprite="egg" [scale]="6" label="Pixel art egg" />

  <h1>PICK MY FILM</h1>
  <p class="dim lede">28 films in the catalogue. We pick one for you.</p>

  @if (!searching()) {
    <button class="btn" type="button" (click)="findFilm()">START</button>
  } @else {
    <div class="box note">
      <h2>COMING SOON</h2>
      <p class="dim">
        Once I re-learn recommender systems this page will be functional!
      </p>
      <button class="btn btn--alt" type="button" (click)="reset()">BACK</button>
    </div>
  }
</div>
