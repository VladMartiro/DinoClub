<header class="bar">
  <div class="wrap bar__in">
    <a class="logo" routerLink="/" (click)="closeNav()">
      <img class="logo__mark" src="dino-club-mark.png" alt="" width="160" height="160" />
      <span>DINO CLUB</span>
    </a>

    <button
      class="bar__toggle"
      type="button"
      [attr.aria-expanded]="navOpen()"
      aria-controls="nav"
      (click)="toggleNav()"
    >
      MENU
    </button>

    <nav id="nav" class="nav" [class.nav--open]="navOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="on"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeNav()"
          >{{ link.label }}</a
        >
      }
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <section class="foot__col">
      <p class="foot__h">CONTACT THE CLUB</p>
      <a class="foot__mail" [href]="'mailto:' + club.email">{{ club.email }}</a>
    </section>

    <nav class="foot__col" aria-label="Footer">
      <p class="foot__h">PAGES</p>
      @for (link of links; track link.path) {
        <a class="foot__link" [routerLink]="link.path">{{ link.label }}</a>
      }
    </nav>

    <section class="foot__col">
      <p class="foot__h">JOIN US</p>
      <a class="foot__link" [href]="club.discordUrl" target="_blank" rel="noopener">DISCORD</a>
      <a class="foot__link" [href]="club.uncClubUrl" target="_blank" rel="noopener">UNC CLUB</a>
    </section>
  </div>
</footer>
