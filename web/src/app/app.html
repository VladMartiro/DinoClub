<header class="bar">
  <div class="wrap bar__in">
    <a class="logo" routerLink="/" (click)="closeNav()">
      <img class="logo__mark" src="dino-club-mark.png" alt="" width="132" height="132" />
      <span>DINO CLUB</span>
    </a>

    <button
      class="bar__toggle"
      type="button"
      [attr.aria-expanded]="navOpen()"
      aria-controls="nav"
      (click)="toggleNav()"
    >
      MENU
    </button>

    <nav id="nav" class="nav" [class.nav--open]="navOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="on"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeNav()"
          >{{ link.label }}</a
        >
      }
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
