[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dinoclub"
version = "0.2.0"
description = "A dinosaur personality test built on trait-vector matching, plus a cold-start movie recommender."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vladimir Martirosyan"}]
keywords = ["personality-quiz", "vector-matching", "euclidean-distance", "recommender-systems", "cold-start"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core library has no runtime dependencies on purpose: `git clone && python
# -m dinoclub.quiz.demo` has to work on a stock Python. Heavier machinery lives
# extras.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# For the learned-axes path in scripts/refit_axes.py, once real ratings exist.
learn = ["numpy>=1.24", "scikit-learn>=1.3"]
# For text-derived item features from plot summaries.
text = ["sentence-transformers>=2.2"]

[project.scripts]
dino-quiz = "dinoclub.quiz.demo:main"
dino-quiz-audit = "dinoclub.quiz.analysis:main"
dino-recommend = "dinoclub.recommend.demo:main"
dino-recommend-eval = "dinoclub.recommend.eval.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dinoclub.quiz" = ["data/*.json"]
"dinoclub.recommend" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
